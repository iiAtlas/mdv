# Local mdv configuration
# Place this file in your project directory as .mdv.yaml
# to override global settings for that directory

# Theme for markdown rendering
# Options: "dark", "light", "auto", "notty", "dracula", "pink", "tokyo-night"
theme: dark

# Text wrap width for terminal rendering
# Set to 0 to disable wrapping
wrap: 80

# Open in GUI mode by default
# Note: You should still use the mdv-gui command for GUI mode
gui: false

# Auto-reload on file changes
# Useful for live preview while editing
watch: false

# Specifically exclude this file
exclude:
- ghost.md

# Editor to use when pressing 'e' in TUI or GUI
editor: code