<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mdv</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="content">Loading…</main>

  <script type="module">
    import { EventsOn } from './wailsjs/runtime/runtime.js';

    async function loadContent() {
      try {
        const html = await window.go.main.App.GetHTML();
        document.getElementById('content').innerHTML = html || "<p>No content.</p>";
      } catch (e) {
        document.getElementById('content').innerHTML = "<p>Failed to load content.</p>";
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadContent();

      // Listen for file change events (watch mode)
      EventsOn('file-changed', async () => {
        console.log('File changed, reloading content...');
        await loadContent();
      });
    });

    // Intercept link clicks and open external links in default browser
    document.addEventListener('click', (e) => {
      const target = e.target.closest('a');
      if (!target) return;

      const href = target.getAttribute('href');
      if (!href) return;

      // Open external links (http/https) in default browser
      if (href.startsWith('http://') || href.startsWith('https://')) {
        e.preventDefault();
        window.go.main.App.OpenURL(href);
      }
    });
  </script>
</body>
</html>
