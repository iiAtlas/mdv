version: 2

env_files:
  github_token: ./github_token

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    - ./scripts/build-wails.sh

builds:
  # TUI binary (mdv) - macOS variants packaged with GUI bundle
  - id: mdv-darwin
    binary: mdv
    main: ./cmd/mdv
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

  # TUI binary (mdv) - cross-platform CLI package
  - id: mdv-cross
    binary: mdv
    main: ./cmd/mdv
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

signs:
  - ids:
      - mdv-darwin
    cmd: codesign
    signature: "${artifact}.sig"
    args:
      - --force
      - --sign
      - "Developer ID Application: Atlas Atlas Atlas LLC (294CD3C5SP)"
      - --options
      - runtime
      - --entitlements
      - cmd/mdv-gui/entitlements.plist
      - --timestamp
      - "${artifact}"

notarize:
  macos:
    - enabled: '{{ if index .Env "AC_USERNAME" }}true{{ else }}false{{ end }}'
      ids:
        - mdv-mac-archive
      sign:
        certificate: '{{ .Env.CERTIFICATE_P12_PATH }}'
        password: '{{ .Env.CERTIFICATE_PASSWORD }}'
        entitlements: cmd/mdv-gui/entitlements.plist
      notarize:
        key_id: '{{ .Env.AC_USERNAME }}'
        issuer_id: '{{ .Env.AC_PROVIDER }}'
        key: '@file:{{ .Env.AC_PASSWORD_FILE }}'

archives:
  - id: mdv-mac-archive
    ids:
      - mdv-darwin
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: LICENSE*
      - src: README*
      - src: examples
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui
        dst: mdv-gui
  - id: mdv-tui-archive
    ids:
      - mdv-cross
    name_template: >-
      {{ .ProjectName }}-
      tui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: LICENSE*
      - src: README*
      - src: examples
  - id: mdv-gui-archive
    ids:
      - mdv-darwin
    name_template: >-
      {{ .ProjectName }}-
      gui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui
        dst: mdv-gui

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Others
      order: 999

homebrew_casks:
  - name: mdv
    ids:
      - mdv-mac-archive
    homepage: https://github.com/iiatlas/mdv
    description: Terminal-based markdown viewer with TUI and GUI modes
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv
    custom_block: |
      binary "mdv-gui"
  - name: mdv-tui
    ids:
      - mdv-tui-archive
    homepage: https://github.com/iiatlas/mdv
    description: Terminal-based markdown viewer (TUI only)
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv
  - name: mdv-gui
    ids:
      - mdv-gui-archive
    homepage: https://github.com/iiatlas/mdv
    description: Native GUI markdown viewer
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv-gui

