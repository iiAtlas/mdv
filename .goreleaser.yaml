version: 2

env:
  - GOCACHE={{ .Env.PWD }}/.cache/go-build
  - GOMODCACHE={{ .Env.PWD }}/.cache/go-mod

env_files:
  github_token: ./github_token

before:
  hooks:
    # Ensure dependencies are up to date
    - mkdir -p .cache/go-build .cache/go-mod
    - go mod tidy
    - ./scripts/build-wails.sh

builds:
  # TUI binary (mdv)
  - id: mdv
    binary: mdv
    main: ./cmd/mdv
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: mdv-mac-archive
    ids:
      - mdv
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: LICENSE*
      - src: README*
      - src: examples/**/*
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui{{ if eq .Os "windows" }}.exe{{ end }}
        dst: mdv-gui{{ if eq .Os "windows" }}.exe{{ end }}
  - id: mdv-tui-archive
    ids:
      - mdv
    name_template: >-
      {{ .ProjectName }}-
      tui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: LICENSE*
      - src: README*
      - src: examples/**/*
  - id: mdv-gui-archive
    builds: []
    files:
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui{{ if eq .Os "windows" }}.exe{{ end }}
        dst: mdv-gui{{ if eq .Os "windows" }}.exe{{ end }}
    name_template: >-
      {{ .ProjectName }}-
      gui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Others
      order: 999

homebrew_casks:
  - name: mdv
    ids:
      - mdv-mac-archive
    homepage: https://github.com/iiatlas/mdv
    description: Terminal-based markdown viewer with TUI and GUI modes
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv
    custom_block: |
      binary "mdv-gui"
  - name: mdv-tui
    ids:
      - mdv-tui-archive
    homepage: https://github.com/iiatlas/mdv
    description: Terminal-based markdown viewer (TUI only)
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv
  - name: mdv-gui
    ids:
      - mdv-gui-archive
    homepage: https://github.com/iiatlas/mdv
    description: Native GUI markdown viewer
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv-gui

