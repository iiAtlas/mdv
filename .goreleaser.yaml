version: 2

env_files:
  github_token: ./github_token

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    - ./scripts/build-wails.sh
    - ./scripts/sign-gui-assets.sh

builds:
  # TUI binary (mdv) - macOS variants packaged with GUI bundle
  - id: mdv-darwin
    binary: mdv
    main: ./cmd/mdv
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'
    hooks:
      post:
        - ./scripts/sign-macos.sh {{ .Path }}
        - ./scripts/notarize-macos.sh {{ .Path }}

  # TUI binary (mdv) - cross-platform CLI package
  - id: mdv-cross
    binary: mdv
    main: ./cmd/mdv
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

  # Note: Linux and Windows GUI binaries are built by ./scripts/build-wails.sh
  # on native runners in CI (see .github/workflows/release.yml).
  # They cannot be cross-compiled here due to CGO requirements.
  # The pre-built binaries are packaged via GitHub Actions workflow.

archives:
  - id: mdv-mac-archive
    ids:
      - mdv-darwin
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: LICENSE*
      - src: README*
      - src: examples
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui
        dst: mdv-gui
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui.app
        dst: mdv-gui.app
  - id: mdv-tui-archive
    ids:
      - mdv-cross
    name_template: >-
      {{ .ProjectName }}-
      tui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: LICENSE*
      - src: README*
      - src: examples
  - id: mdv-gui-archive
    ids:
      - mdv-darwin
    name_template: >-
      {{ .ProjectName }}-
      gui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui
        dst: mdv-gui
      - src: cmd/mdv-gui/build/bin/mdv-gui_{{ .Os }}_{{ .Arch }}/mdv-gui.app
        dst: mdv-gui.app

  # Note: Linux and Windows GUI archives are created by GitHub Actions workflow
  # after building on native runners. See .github/workflows/release.yml

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Others
      order: 999

homebrew_casks:
  - name: mdv
    ids:
      - mdv-mac-archive
    homepage: https://github.com/iiatlas/mdv
    description: Terminal-based markdown viewer with TUI and GUI modes
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv
    custom_block: |
      binary "mdv-gui"
  - name: mdv-tui
    ids:
      - mdv-tui-archive
    homepage: https://github.com/iiatlas/mdv
    description: Terminal-based markdown viewer (TUI only)
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv
  - name: mdv-gui
    ids:
      - mdv-gui-archive
    homepage: https://github.com/iiatlas/mdv
    description: Native GUI markdown viewer
    license: MIT
    repository:
      owner: iiatlas
      name: homebrew-tap
    directory: Casks
    binary: mdv-gui

