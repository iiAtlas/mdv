version: "3"

vars:
  APP: mdv
  GUI_DIR: cmd/mdv-gui
  TUI_DIR: cmd/mdv
  TEST_FILE: test.md
  GOPATH:
    sh: go env GOPATH
  GOBIN:
    sh: go env GOBIN
  BIN_DIR:
    sh: |
      gobin=$(go env GOBIN)
      if [ -n "$gobin" ]; then
        echo "$gobin"
      else
        echo "$(go env GOPATH)/bin"
      fi

env:
  CGO_ENABLED: "1" # Wails needs cgo

tasks:
  default:
    desc: Build both TUI and GUI versions
    deps: [build:all]

  deps:
    desc: Install/update dependencies
    cmds:
      - go mod download
      - go mod tidy

  # === BUILD TASKS ===

  build:tui:
    desc: Build TUI binary to ./mdv
    cmds:
      - go build -o ./{{.APP}} ./{{.TUI_DIR}}
      - echo "Built ./{{.APP}}"
    sources:
      - "{{.TUI_DIR}}/**/*.go"
      - "internal/**/*.go"
    generates:
      - ./{{.APP}}

  build:gui:
    desc: Build GUI (Wails) binary
    dir: "{{.GUI_DIR}}"
    cmds:
      - wails build
      - echo "Built {{.GUI_DIR}}/build/bin/mdv-gui"
    sources:
      - "**/*.go"
      - "frontend/**/*"
    generates:
      - build/bin/mdv-gui

  build:all:
    desc: Build both TUI and GUI
    deps: [build:tui, build:gui]

  # === RUN TASKS ===

  run:tui:
    desc: Run TUI viewer (use -- to pass args, e.g. task run:tui -- README.md)
    cmds:
      - go run ./{{.TUI_DIR}} {{.CLI_ARGS | default .TEST_FILE}}
    silent: false

  run:gui:
    desc: Run GUI (Wails) viewer in dev mode (use -- to pass args, e.g. task run:gui -- README.md)
    dir: "{{.GUI_DIR}}"
    vars:
      ABS_PATH:
        sh: '{{if .CLI_ARGS}}realpath "{{.CLI_ARGS}}"{{end}}'
    cmds:
      - wails dev{{if .ABS_PATH}} -appargs "{{.ABS_PATH}}"{{end}}
    silent: false

  demo:
    desc: Run commands with locally built binaries (simulates installation, e.g. task demo -- mdv -g examples/demo.md)
    deps: [build:tui, build:gui]
    vars:
      ROOT_DIR:
        sh: pwd
    cmds:
      - cd {{.USER_WORKING_DIR}} && PATH={{.ROOT_DIR}}:{{.ROOT_DIR}}/{{.GUI_DIR}}/build/bin:{{.ROOT_DIR}}/{{.GUI_DIR}}/build/bin/mdv-gui.app/Contents/MacOS:$PATH {{.CLI_ARGS}}
    silent: false

  # === CLEAN TASKS ===

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f ./{{.APP}}
      - rm -rf {{.GUI_DIR}}/build
      - rm -rf {{.GUI_DIR}}/frontend/wailsjs
      - echo "Cleaned build artifacts"

  # === INSTALL TASKS ===

  install:tui:
    desc: Install TUI to bin directory
    cmds:
      - cd {{.TUI_DIR}} && go install
      - echo "Installed {{trim .BIN_DIR}}/{{.APP}}"

  install:gui:
    desc: Install GUI to bin directory
    deps: [build:gui]
    platforms: [darwin, linux, windows]
    cmds:
      - |
        BIN_DIR="{{trim .BIN_DIR}}"
        mkdir -p "$BIN_DIR"
        {{if eq OS "darwin"}}
        rm -f "$BIN_DIR/mdv-gui"
        rm -rf "$BIN_DIR/mdv-gui.app"
        cp -R "{{.GUI_DIR}}/build/bin/mdv-gui.app" "$BIN_DIR/"
        ln -sf "$BIN_DIR/mdv-gui.app/Contents/MacOS/mdv-gui" "$BIN_DIR/mdv-gui"
        {{else if eq OS "windows"}}
        rm -f "$BIN_DIR/mdv-gui.exe"
        cp "{{.GUI_DIR}}/build/bin/mdv-gui.exe" "$BIN_DIR/"
        {{else}}
        rm -f "$BIN_DIR/mdv-gui"
        cp "{{.GUI_DIR}}/build/bin/mdv-gui" "$BIN_DIR/"
        {{end}}
      - echo "Installed {{trim .BIN_DIR}}/mdv-gui{{if eq OS "windows"}}.exe{{end}}"

  install:all:
    desc: Install both TUI and GUI
    deps: [install:tui, install:gui]

  uninstall:tui:
    desc: Uninstall TUI from bin directory
    cmds:
      - rm -f "{{trim .BIN_DIR}}/{{.APP}}"
      - echo "Uninstalled {{trim .BIN_DIR}}/{{.APP}}"

  uninstall:gui:
    desc: Uninstall GUI from bin directory
    cmds:
      - rm -f "{{trim .BIN_DIR}}/mdv-gui" "{{trim .BIN_DIR}}/mdv-gui.exe"
      - rm -rf "{{trim .BIN_DIR}}/mdv-gui.app"
      - echo "Uninstalled {{trim .BIN_DIR}}/mdv-gui"

  uninstall:all:
    desc: Uninstall both TUI and GUI
    deps: [uninstall:tui, uninstall:gui]

  # === WATCH TASKS ===

  watch:
    desc: Run TUI with built-in file watching (press 'r' to reload)
    cmds:
      - go run ./{{.TUI_DIR}} --watch {{.CLI_ARGS | default .TEST_FILE}}

  # === TEST TASKS ===

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  # === LINT/FORMAT TASKS ===

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...
      - echo "Code formatted"

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run
    preconditions:
      - sh: command -v golangci-lint
        msg: "Install golangci-lint: brew install golangci-lint"

  # === RELEASE TASKS ===

  release:
    desc: Create release artifacts via GoReleaser
    cmds:
      - goreleaser release --clean
    preconditions:
      - sh: command -v goreleaser
        msg: "Install GoReleaser: brew install goreleaser"

  release:snapshot:
    desc: Build snapshot release (no publish)
    cmds:
      - goreleaser release --snapshot --clean
    preconditions:
      - sh: command -v goreleaser
        msg: "Install GoReleaser: brew install goreleaser"

  # === HELP ===

  help:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true
