name: Test Release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # Required to post PR comments

jobs:
  # Call reusable workflow to build and package
  build-and-package:
    uses: ./.github/workflows/build-and-package.yml
    with:
      is_release: false
      artifact_retention_days: 7
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      macos_sign_p12: ${{ secrets.MACOS_SIGN_P12 }}
      macos_sign_password: ${{ secrets.MACOS_SIGN_PASSWORD }}
      macos_notary_key: ${{ secrets.MACOS_NOTARY_KEY }}
      macos_notary_key_id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      macos_notary_issuer_id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  # Validate release artifacts
  validate:
    needs: build-and-package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Validating Release Artifacts ==="

          # Check GoReleaser dist directory
          echo ""
          echo "GoReleaser dist contents:"
          ls -lh dist/ || echo "No dist/ directory found"

          # Check for expected archives
          echo ""
          echo "Checking for expected archives..."

          expected_files=(
            "dist/mdv_*_darwin_*.tar.gz"
            "dist/mdv-tui_*_linux_*.tar.gz"
            "dist/mdv-tui_*_windows_*.zip"
            "dist/mdv-gui_*_darwin_*.tar.gz"
            "mdv-gui_*_linux_*.tar.gz"
            "mdv-gui_*_windows_*.zip"
          )

          missing_files=()
          for pattern in "${expected_files[@]}"; do
            if ! ls $pattern 1>/dev/null 2>&1; then
              missing_files+=("$pattern")
            else
              echo "✅ Found: $pattern"
              ls -lh $pattern
            fi
          done

          if [ ${#missing_files[@]} -gt 0 ]; then
            echo ""
            echo "⚠️  Missing expected files:"
            printf '%s\n' "${missing_files[@]}"
            echo ""
            echo "This may be expected if not all platforms built successfully."
          fi

          # Check checksums file
          echo ""
          if [ -f "dist/checksums.txt" ]; then
            echo "✅ Checksums file created:"
            cat dist/checksums.txt
          else
            echo "❌ No checksums.txt found"
          fi

          # Check GUI checksums
          echo ""
          if [ -f "gui-checksums.txt" ]; then
            echo "✅ GUI checksums file created:"
            cat gui-checksums.txt
          else
            echo "❌ No gui-checksums.txt found"
          fi

          echo ""
          echo "=== Validation Complete ==="

  # Comment on PR with build summary
  comment-pr:
    needs: build-and-package
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Comment PR with artifact summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // Get artifact sizes
            let summary = '## 🧪 Test Release Summary\n\n';
            summary += 'All binaries built and signed successfully! ✅\n\n';
            summary += `**Version:** \`${{ needs.build-and-package.outputs.version }}\`\n\n`;
            summary += '### Artifacts Created\n\n';

            try {
              const files = execSync('ls -lh dist/*.tar.gz dist/*.zip mdv-gui_*.tar.gz mdv-gui_*.zip 2>/dev/null || true')
                .toString()
                .split('\n')
                .filter(line => line.trim());

              if (files.length > 0) {
                summary += '```\n';
                files.forEach(file => summary += file + '\n');
                summary += '```\n\n';
              }
            } catch (e) {
              summary += '_Could not list artifact files_\n\n';
            }

            const guiSections = [
              {
                title: 'Linux GUI archives',
                command: 'ls -lh mdv-gui_*_linux_*.tar.gz 2>/dev/null || true'
              },
              {
                title: 'Windows GUI archives',
                command: 'ls -lh mdv-gui_*_windows_*.zip 2>/dev/null || true'
              }
            ];

            guiSections.forEach(({ title, command }) => {
              try {
                const output = execSync(command).toString().split('\n').filter(line => line.trim());
                summary += `### ${title}\n\n`;
                if (output.length > 0) {
                  summary += '```\n';
                  output.forEach(line => summary += line + '\n');
                  summary += '```\n\n';
                } else {
                  summary += '_No archives found_\n\n';
                }
              } catch (e) {
                summary += `### ${title}\n\n_Could not list files_\n\n`;
              }
            });

            // Add GUI checksums if available
            try {
              const checksums = fs.readFileSync('gui-checksums.txt', 'utf8');
              if (checksums.trim()) {
                summary += '### GUI Checksums (SHA256)\n\n';
                summary += '```\n';
                summary += checksums;
                summary += '```\n\n';
              }
            } catch (e) {
              // Checksums file not found or error reading
            }

            summary += '### Platform Coverage\n\n';
            summary += '- ✅ macOS (darwin/amd64, darwin/arm64) - Signed & Notarized\n';
            summary += '- ✅ Linux (linux/amd64, linux/arm64)\n';
            summary += '- ✅ Windows (windows/amd64)\n\n';
            summary += '### What was tested\n\n';
            summary += '- [x] GUI builds on all platforms\n';
            summary += '- [x] Code signing (macOS)\n';
            summary += '- [x] Notarization (macOS)\n';
            summary += '- [x] Archive creation\n';
            summary += '- [x] Checksum generation\n\n';
            summary += '**Note:** This is a test release. No artifacts were published to GitHub Releases or Homebrew.\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
