name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Set up Code Signing & Notarization
        run: |
          # Create a temporary keychain
          security create-keychain -p "${{ secrets.CERTIFICATE_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.CERTIFICATE_PASSWORD }}" build.keychain

          # Import certificate
          echo "${{ secrets.CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign

          # Allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.CERTIFICATE_PASSWORD }}" build.keychain

          # Save App Store Connect API key to file
          printf '%s' "${{ secrets.AC_PASSWORD }}" > "${{ github.workspace }}/AuthKey.p8"
          chmod 600 "${{ github.workspace }}/AuthKey.p8"

          # Clean up certificate
          rm certificate.p12

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CODESIGN_IDENTITY: "Developer ID Application: Atlas Atlas Atlas LLC (294CD3C5SP)"
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: "${{ github.workspace }}/AuthKey.p8"
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PROVIDER: ${{ secrets.AC_PROVIDER }}

      - name: Clean up temporary key file
        if: ${{ always() }}
        run: rm -f "${{ github.workspace }}/AuthKey.p8"
