name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.AC_PASSWORD }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.AC_USERNAME }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.AC_PROVIDER }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
