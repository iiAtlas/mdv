name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Set up Code Signing & Notarization
        run: |
          set -euo pipefail

          KEYCHAIN_PASSWORD="${{ secrets.CERTIFICATE_PASSWORD }}"
          KEYCHAIN_NAME="mdv-${GITHUB_RUN_ID}.keychain-db"
          KEYCHAIN_PATH="${RUNNER_TEMP}/${KEYCHAIN_NAME}"
          CERT_RAW_PATH="${RUNNER_TEMP}/certificate_raw.p12"
          CERT_TRIMMED_PATH="${RUNNER_TEMP}/certificate_trimmed.p12"
          AUTH_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import certificate and re-export a clean PKCS#12 bundle for GoReleaser
          printf '%s' "${{ secrets.CERTIFICATE_BASE64 }}" | base64 --decode > "$CERT_RAW_PATH"
          security import "$CERT_RAW_PATH" -k "$KEYCHAIN_PATH" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          security export -k "$KEYCHAIN_PATH" -t identities -f pkcs12 -P "$KEYCHAIN_PASSWORD" -o "$CERT_TRIMMED_PATH"
          security import "$CERT_TRIMMED_PATH" -k "$KEYCHAIN_PATH" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_RAW_PATH"

          # Allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Save App Store Connect API key to file and expose path for later steps
          printf '%s' "${{ secrets.AC_PASSWORD }}" > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          # Export paths for later steps
          {
            echo "AC_PASSWORD_FILE=$AUTH_KEY_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "CERTIFICATE_P12_PATH=$CERT_TRIMMED_PATH"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CODESIGN_IDENTITY: "Developer ID Application: Atlas Atlas Atlas LLC (294CD3C5SP)"
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          CERTIFICATE_P12_PATH: ${{ env.CERTIFICATE_P12_PATH }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PROVIDER: ${{ secrets.AC_PROVIDER }}
          AC_PASSWORD_FILE: ${{ env.AC_PASSWORD_FILE }}

      - name: Clean up temporary key file
        if: ${{ always() }}
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "${AC_PASSWORD_FILE:-}" ]]; then
            rm -f "$AC_PASSWORD_FILE"
          fi
          if [[ -n "${CERTIFICATE_P12_PATH:-}" ]]; then
            rm -f "$CERTIFICATE_P12_PATH"
          fi
