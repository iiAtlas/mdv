name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build GUI binaries on native platforms
  build-gui:
    name: Build GUI (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            platforms: linux/amd64
            cc: gcc
            artifact-name: gui-linux-amd64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            platforms: linux/arm64
            cc: gcc
            artifact-name: gui-linux-arm64
          - name: macos
            os: macos-latest
            platforms: darwin/amd64,darwin/arm64
            cc: ""
            artifact-name: gui-macos
          - name: windows
            os: windows-latest
            platforms: windows/amd64
            cc: ""
            artifact-name: gui-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          # Install native build tools
          sudo apt-get install -y \
            build-essential \
            pkg-config

          # Install native GTK/WebKit libraries (works for both amd64 and arm64)
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install mingw -y
          refreshenv

      - name: Build GUI
        env:
          WAILS_PLATFORMS: ${{ matrix.platforms }}
          CC: ${{ matrix.cc }}
        run: ./scripts/build-wails.sh

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: cmd/mdv-gui/build/bin/
          retention-days: 1

  # Main release job
  release:
    needs: build-gui
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Configure signing keychain
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/mdv-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/mdv-signing-cert.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/mdv-notary-key.p8"
          PROFILE_NAME="mdv-notary-profile"

          printf '%s' "$MACOS_SIGN_P12" | base64 --decode >"$CERT_PATH"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode >"$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials "$PROFILE_NAME" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "MACOS_NOTARY_PROFILE_NAME=$PROFILE_NAME"
            echo "CODESIGN_IDENTITY=Developer ID Application: Atlas Atlas Atlas LLC (294CD3C5SP)"
          } >>"$GITHUB_ENV"
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Download all GUI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cmd/mdv-gui/build/bin/
          merge-multiple: true

      - name: Flatten downloaded GUI artifacts
        shell: bash
        run: |
          set -euo pipefail
          base_dir="cmd/mdv-gui/build/bin"

          if [ ! -d "$base_dir" ]; then
            echo "Base GUI directory not found: $base_dir"
            exit 1
          fi

          shopt -s nullglob dotglob
          for artifact_dir in "$base_dir"/gui-*; do
            if [ -d "$artifact_dir" ]; then
              inner_dir="$artifact_dir/cmd/mdv-gui/build/bin"
              if [ -d "$inner_dir" ]; then
                echo "Flattening $artifact_dir"
                cp -a "$inner_dir"/. "$base_dir"/
                rm -rf "$artifact_dir"
              fi
            fi
          done
          shopt -u nullglob dotglob

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded GUI artifacts ==="
          ls -laR cmd/mdv-gui/build/bin/

      - name: Create Linux GUI archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"

          for arch in amd64 arm64; do
            arch_name=$([ "$arch" = "amd64" ] && echo "x86_64" || echo "$arch")
            gui_dir="cmd/mdv-gui/build/bin/mdv-gui_linux_${arch}"

            if [ -d "$gui_dir" ] && [ -f "$gui_dir/mdv-gui" ]; then
              archive="mdv-gui_${VERSION}_linux_${arch_name}.tar.gz"
              echo "Creating $archive"

              mkdir -p /tmp/mdv-gui-linux
              cp "$gui_dir/mdv-gui" /tmp/mdv-gui-linux/
              cp LICENSE* /tmp/mdv-gui-linux/ || true
              cp README* /tmp/mdv-gui-linux/ || true
              cp -r examples /tmp/mdv-gui-linux/ || true

              tar -czf "$archive" -C /tmp/mdv-gui-linux .
              rm -rf /tmp/mdv-gui-linux

              echo "Created: $archive ($(du -h "$archive" | cut -f1))"
            else
              echo "Warning: Linux $arch GUI binary not found, skipping"
            fi
          done

      - name: Upload Linux GUI archives to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          for archive in mdv-gui_*.tar.gz; do
            if [ -f "$archive" ]; then
              echo "Uploading $archive to release..."
              gh release upload "${GITHUB_REF#refs/tags/}" "$archive" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create Windows GUI archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"

          for arch in amd64; do
            arch_name=$([ "$arch" = "amd64" ] && echo "x86_64" || echo "$arch")
            gui_dir="cmd/mdv-gui/build/bin/mdv-gui_windows_${arch}"

            if [ -d "$gui_dir" ] && [ -f "$gui_dir/mdv-gui.exe" ]; then
              archive="mdv-gui_${VERSION}_windows_${arch_name}.zip"
              echo "Creating $archive"

              temp_dir=$(mktemp -d)
              cp "$gui_dir/mdv-gui.exe" "$temp_dir/"
              cp LICENSE* "$temp_dir/" 2>/dev/null || true
              cp README* "$temp_dir/" 2>/dev/null || true
              cp -r examples "$temp_dir/" 2>/dev/null || true

              # Create zip archive
              (cd "$temp_dir" && zip -r "../$archive" .)
              rm -rf "$temp_dir"

              echo "Created: $archive ($(du -h "$archive" | cut -f1))"
            else
              echo "Warning: Windows $arch GUI binary not found, skipping"
            fi
          done

      - name: Upload Windows GUI archives to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          for archive in mdv-gui_*_windows_*.zip; do
            if [ -f "$archive" ]; then
              echo "Uploading $archive to release..."
              gh release upload "${GITHUB_REF#refs/tags/}" "$archive" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Verify macOS signatures
        run: ./scripts/verify-macos-signatures.sh
